version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      # yt-dlp has to keep up with YouTube, so it gets its own PR rather than
      # waiting on the rest
      yt-dlp:
        patterns: ["yt-dlp*"]
      python-packages:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Move to a new Python release deliberately, not through a weekly PR
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
