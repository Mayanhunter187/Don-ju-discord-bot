version: 2
# Every update targets the test branch, so it runs on the test bot before it's
# merged into main
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: test
    schedule:
      interval: weekly
    groups:
      # yt-dlp has to keep up with YouTube, so it gets its own PR rather than
      # waiting on the rest
      yt-dlp:
        patterns: ["yt-dlp*"]
      python-packages:
        patterns: ["*"]
    ignore:
      # discord.py[voice] pins PyNaCl below 1.6, so newer releases can't install
      # until discord.py raises that limit
      - dependency-name: pynacl
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /
    target-branch: test
    schedule:
      interval: weekly
    ignore:
      # Move to a new Python release deliberately, not through a weekly PR
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The same for Node.js (yt-dlp's JS challenge solver)
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: test
    schedule:
      interval: monthly
