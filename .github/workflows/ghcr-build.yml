name: build-and-publish

# Each branch runs its own bot: a push to test updates the test bot, a push to
# main updates the main bot. Argo CD watches each bot's overlay on its branch.
on:
  push:
    branches: [main, test]
    paths-ignore: ['deploy/**', '**.md']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run, so an older image
# can never be deployed over a newer one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mayanhunter187/don-ju-discord-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  build:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'test')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        run: echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Plus a floating tag for the branch: main or test
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Same conditions as the cluster: read-only root filesystem, writable /tmp
      - name: Smoke-test the image
        run: |
          docker run --rm --read-only --tmpfs /tmp "$IMAGE:${{ steps.meta.outputs.tag }}" python -c "
          import os, shutil
          import main, cogs.music, cogs.help, yt_dlp_ejs
          assert os.getuid() != 0, 'container runs as root'
          for tool in ('ffmpeg', 'node'):
              assert shutil.which(tool), f'{tool} missing'
          print('image ok')
          "

      - run: echo "Pushed \`${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  # Point this branch's bot at the new image, on the same branch; Argo CD rolls it out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Commit the new image tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
          OVERLAY: deploy/k8s/overlays/${{ github.ref_name == 'main' && 'prod' || 'test' }}
        run: |
          sed -i -E "s#(newTag:).*#\1 ${TAG}#" "$OVERLAY/kustomization.yaml"
          if git diff --quiet; then echo "Already deployed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${TAG} to $(basename "$OVERLAY")"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
