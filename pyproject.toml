[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pyflakes and ruff's default pycodestyle checks, plus whitespace (W),
# likely bugs (B) and outdated syntax for Python 3.11 (UP)
select = ["E4", "E7", "E9", "F", "W", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
