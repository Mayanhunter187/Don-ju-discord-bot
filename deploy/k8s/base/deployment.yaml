apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-music-bot
  namespace: don-ju
  labels:
    app: discord-music-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: discord-music-bot
  template:
    metadata:
      labels:
        app: discord-music-bot
    spec:
      containers:
        - name: discord-music-bot
          image: ghcr.io/mayanhunter187/don-ju-discord-bot:20260902-d94c0f4
          imagePullPolicy: IfNotPresent
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: token
          volumeMounts:
            - name: cookies
              mountPath: /tmp/cookies-ro
              readOnly: true
            - name: songs
              mountPath: /app/songs
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: cookies
          secret:
            secretName: youtube-cookies
        - name: songs
          persistentVolumeClaim:
            claimName: don-ju-songs
