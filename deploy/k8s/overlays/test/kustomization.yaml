# The test bot: a separate Discord app that gets every build before production.
# CI sets newTag on each build. No alerts here, so a broken test build never
# pages anyone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: don-ju-test
resources:
  - ../../base
images:
  - name: ghcr.io/mayanhunter187/don-ju-discord-bot
    newTag: 20261015-af62744
