# The test bot, a separate Discord app. Argo CD deploys this folder from the
# test branch, and CI sets newTag on every push to test. No alerts here, so a
# broken test build never pages anyone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: don-ju-test
resources:
  - ../../base
images:
  - name: ghcr.io/mayanhunter187/don-ju-discord-bot
    newTag: 20261016-c7dfb8e
