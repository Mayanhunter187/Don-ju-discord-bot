# Grafana loads ConfigMaps labelled grafana_dashboard=1 from any namespace.
# The "Bot" dropdown switches between environments (don-ju, don-ju-test).
apiVersion: v1
kind: ConfigMap
metadata:
  name: don-ju-dashboard
  labels:
    grafana_dashboard: '1'
data:
  don-ju.json: |
    {
      "uid": "don-ju",
      "title": "Don'Ju",
      "tags": [
        "don-ju",
        "discord"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          },
          {
            "name": "namespace",
            "label": "Bot",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(donju_leader, namespace)",
              "refId": "namespace"
            },
            "definition": "label_values(donju_leader, namespace)",
            "current": {
              "text": "don-ju",
              "value": "don-ju"
            },
            "refresh": 2,
            "sort": 1,
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Leader",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (pod) (donju_leader{namespace=\"$namespace\"})",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "standby",
                      "color": "blue"
                    },
                    "1": {
                      "text": "leader",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Voice connections",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(donju_voice_connections{namespace=\"$namespace\"})",
              "legendFormat": "voice",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Queued songs",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 10,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(donju_queue_length{namespace=\"$namespace\"})",
              "legendFormat": "queued",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Discord latency",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 14,
            "y": 0,
            "w": 5,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(donju_discord_latency_seconds{namespace=\"$namespace\"} > 0)",
              "legendFormat": "latency",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Restarts (24h)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 19,
            "y": 0,
            "w": 5,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\",container=\"discord-music-bot\"}[24h]))",
              "legendFormat": "restarts",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Songs played per hour",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (source) (increase(donju_songs_played_total{namespace=\"$namespace\"}[1h]))",
              "legendFormat": "{{source}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Commands per hour",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 5,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (command) (increase(donju_commands_total{namespace=\"$namespace\"}[1h]))",
              "legendFormat": "/{{command}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Command errors",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 5,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (command) (increase(donju_command_errors_total{namespace=\"$namespace\"}[1h]))",
              "legendFormat": "/{{command}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "yt-dlp calls per minute",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (kind, result) (rate(donju_ytdl_calls_total{namespace=\"$namespace\"}[5m])) * 60",
              "legendFormat": "{{kind}} {{result}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "yt-dlp time (p50 / p95)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 12,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (kind, le) (rate(donju_ytdl_seconds_bucket{namespace=\"$namespace\"}[15m])))",
              "legendFormat": "p50 {{kind}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (kind, le) (rate(donju_ytdl_seconds_bucket{namespace=\"$namespace\"}[15m])))",
              "legendFormat": "p95 {{kind}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Cache size",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 12,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "donju_cache_bytes{namespace=\"$namespace\"}",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Memory",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\",container=\"discord-music-bot\"})",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "B",
              "expr": "max(kube_pod_container_resource_limits{namespace=\"$namespace\",container=\"discord-music-bot\",resource=\"memory\"})",
              "legendFormat": "limit",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "CPU",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 19,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container=\"discord-music-bot\"}[5m]))",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Lease and state errors",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 19,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(donju_lease_errors_total{namespace=\"$namespace\"}[15m]))",
              "legendFormat": "lease",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "B",
              "expr": "sum(increase(donju_state_save_errors_total{namespace=\"$namespace\"}[15m]))",
              "legendFormat": "state save",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
