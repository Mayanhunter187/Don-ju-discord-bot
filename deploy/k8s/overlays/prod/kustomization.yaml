# The main bot. Argo CD deploys this folder from the main branch, and CI sets
# newTag on every push to main.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: don-ju
resources:
  - ../../base
  # One dashboard covers every environment (pick one at the top)
  - dashboard.yaml
  - prometheusrule.yaml
images:
  - name: ghcr.io/mayanhunter187/don-ju-discord-bot
    newTag: 20261016-6beef19
